services:
  - type: web
    name: agentreliability-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers"
    healthCheckPath: "/api/health"
    envVars:
      - key: AGENTRELIABILITY_ENV
        value: production
      - key: PYTHONPATH
        value: .
      - key: DATABASE_URL
        sync: false
      - key: AGENTRELIABILITY_COOKIE_SECURE
        value: "true"
      - key: AGENTRELIABILITY_COOKIE_SAMESITE
        value: "none"
      - key: AGENTRELIABILITY_ALLOWED_ORIGINS
        sync: false
