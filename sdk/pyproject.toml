[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentreliability"
version = "0.1.0"
description = "Python SDK for AgentReliability AI: trace, monitor and debug AI agents."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []   # standard library only, on purpose

[project.optional-dependencies]
dev = ["pytest"]
crewai = ["crewai>=0.80.0"]
langchain = ["langchain-core>=0.3.0"]
langgraph = ["langchain-core>=0.3.0", "langgraph>=0.2.0"]
all = ["crewai>=0.80.0", "langchain-core>=0.3.0", "langgraph>=0.2.0"]

[project.scripts]
agentreliability = "agentreliability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

