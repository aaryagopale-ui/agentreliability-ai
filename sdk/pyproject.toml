[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentreliability"
version = "0.1.0"
description = "Python SDK for AgentReliability AI: trace, monitor and debug AI agents."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []   # standard library only, on purpose

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
agentreliability = "agentreliability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

